# The reviews a change must pass before it merges. `gaff reviews`
# prints them and `gaff reviews check` holds them, so no gate
# hard-codes a name.
#
# An absent key means this repo declared no policy, and the check
# refuses the push. An unknown policy is not an empty one. Write
# `reviews: []` to require none.
reviews:
  - fresh-eyes
  - mutation

# Repo-level gaff config. Two entries. The commit gate holds formatted
# code and a clean clippy on pre-commit. The merge gate holds tests,
# the missouri suite, and a fresh-eyes review note on pre-push, which
# is the merge check in a repo that merges by direct push. Installed by
# `gaff init --git`.
git:
  - name: commit-gate
    on:
      - pre-commit
    command:
      - sh
      - scripts/commit-gate.sh
  - name: merge-gate
    on:
      - pre-push
    command:
      - sh
      - scripts/merge-gate.sh

# The CI gate runs the same declarations under `gaff ci`.
# Branch protection on main requires this check.
#
github:
  - name: gate
    # A pull request only, on purpose. A squash merge writes a commit
    # that no note names: a reviewer signs the branch tip, and the
    # squash creates a different commit afterwards. So a run on `main`
    # failed after every merge.
    #
    # `gaff ci` reads the branch head from the event payload. That is
    # the commit a reviewer read, and branch protection gates the
    # merge from there.
    #
    # This gives up two things. A push to a branch with no pull
    # request runs no CI, and the local hook covers only whoever
    # installed it. Open the pull request as a draft to get the gate
    # back. Nothing runs on `main` after a merge either.
    on:
      - pull_request
    steps:
      - name: fetch review notes
        command: [sh, -c, "git fetch origin +refs/notes/reviews:refs/notes/reviews || true"]
      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: rust cache
        uses: Swatinem/rust-cache@v2
      - name: install missouri from tree
        command: [sh, -c, "cargo install --path . --locked --root \"$HOME/.missouri-tools\" missouri && echo \"$HOME/.missouri-tools/bin\" >> \"$GITHUB_PATH\""]
      # The docker-backend test skips when the image is absent. The
      # pull removes that skip on CI, so the backend stays covered.
      - name: pull the docker test image
        command: [docker, pull, "debian:bookworm-slim"]
      - name: gaff
        uses: cjohnhanson/gaff@main
