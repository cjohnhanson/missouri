# Generated by gaff from the gaff config. Do not edit.
# Change the config, then run `gaff init --github`.
# `gaff check --github` reports a file that drifted.
name: 'gate'

on:
  push:

jobs:
  gate:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - name: 'fetch review notes'
        run: |
          sh -c 'git fetch origin +refs/notes/reviews:refs/notes/reviews || true'
      - name: 'rust toolchain'
        uses: 'dtolnay/rust-toolchain@stable'
        with:
          'components': 'clippy, rustfmt'
      - name: 'rust cache'
        uses: 'Swatinem/rust-cache@v2'
      - name: 'install missouri from tree'
        run: |
          sh -c 'cargo install --path . --locked --root "$HOME/.missouri-tools" missouri && echo "$HOME/.missouri-tools/bin" >> "$GITHUB_PATH"'
      - name: 'pull the docker test image'
        run: |
          docker pull debian:bookworm-slim
      - name: 'gaff'
        uses: 'cjohnhanson/gaff@main'
