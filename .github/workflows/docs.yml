# The family docs checks: the docs test exists, tool commands sit in
# blocks it runs, the README shape, spelling, and links. Not generated by
# gaff.
name: docs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  family:
    uses: cjohnhanson/diataxis/.github/workflows/family-checks.yml@main
    with:
      tool: missouri
