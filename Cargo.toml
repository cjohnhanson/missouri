[package]
name = "missouri"
version = "0.2.0"
edition = "2024"
description = "Show-me-state: e2e testing as directed graphs of filesystem states"
license = "MIT"
authors = ["Cody Hanson"]
repository = "https://github.com/cjohnhanson/missouri"
homepage = "https://github.com/cjohnhanson/missouri"
keywords = ["testing", "e2e", "docker", "filesystem", "cli"]
categories = ["development-tools::testing", "command-line-utilities"]

# Repository machinery belongs on GitHub. A consumer installing the
# crate gets the source, the license, and the README.
exclude = [
    # The npm wrapper and its generator are release machinery. The
    # generated platform packages each hold a built binary, and one of
    # those reached a crate before this line existed.
    "npm/",
    # Drives npm/, dropped above, so it cannot run from the tarball.
    "tests/npm_wrapper_platforms.rs",
    ".tisket/",
    "tisket.yml",
    ".gaff/",
    ".github/",
    ".agents/",
    "scripts/",
    "tests/fixtures/",
    "tests/missouri-msb/",
    "CONTRIBUTING.md",
    "AGENTS.md",
    ".editorconfig",
    "rust-toolchain.toml",
]

# Two names, one build. `missouri` is what a person types. `msri` exists
# because the registries that matter for `uvx` and `npx` needed a free
# name, and maturin ties the command to the Cargo bin name.
[[bin]]
name = "missouri"
path = "src/main.rs"

[[bin]]
name = "msri"
path = "src/bin/msri.rs"

[dependencies]
camino = { version = "1", features = ["serde1"] }
bollard = "0.18"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
ctrlc = "3.4"
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
dotenvy = "0.15"
ignore = "0.4"
libc = "0.2"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
walkdir = "2"
serde_json = "1.0.149"
chrono = "0.4.43"
rayon = "1.11.0"
regex = "1"
sigpipe = "0.1.3"

# The documentation set: the pages, and the `docs` subcommand over
# them. The build half reads docs/ and carries no dependencies.
diataxis = { version = "0.1", default-features = false, features = ["cli"] }

[build-dependencies]
diataxis = { version = "0.1", default-features = false, features = ["build"] }

[lints.rust]
warnings = "deny"
unused_imports = "deny"
unused_variables = "deny"
dead_code = "deny"
unreachable_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = "allow"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

# A released binary carries no debug symbols, and a user installing a
# CLI never reads them. Thin LTO with one codegen unit trades build
# time for size and speed. A release builds once and installs often.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
