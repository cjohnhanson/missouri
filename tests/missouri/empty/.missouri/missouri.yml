transitions:
  - name: "shell command creates file"
    command: "echo 'hello world' > output.txt"
    shell: true
    target: ../with-shell-output

  - name: "direct command creates file"
    command: "echo direct > direct.txt"
    shell: true
    target: ../with-direct-output

  - name: "docs lists the bundled pages"
    command: "missouri docs > docs.txt"
    shell: true
    target: ../docs-list
