assertions:
  - name: "check original content"
    command: "cat data.txt"
    stdout: "original\n"
  - name: "data file exists"
    command: "test -f data.txt"

transitions:
  - name: "transform data"
    command: "printf 'transformed\n' > data.txt && echo 'done'"
    target: "../after"
    stdout: "done\n"
    stderr: ""
