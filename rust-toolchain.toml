# Pin CI and local runs to one Rust version, so a local green means a
# green gate. An unpinned `stable` turns the gate red on code nobody
# touched, and two versions disagree on lints. Rust 1.95 passed one that
# 1.98 refused. Raise this version deliberately, and fix what the new
# version finds in the same commit.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
